<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NexusFind · Admin Dashboard</title>
  <link rel="icon" href="images/favicon-32x32.png"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">
  <div class="app-shell admin-shell">
    <aside class="sidebar admin-sidebar">
      <a class="brand admin-brand" href="index.html"><img class="brand-logo" src="images/logo_nexusfind.png" alt="NexusFind logo"><span class="brand-name">Nexus<span>Find</span></span></a>
      <nav class="nav admin-nav" aria-label="Admin navigation"><a class="nav-link" href="index.html">← Main site</a>
        <button class="nav-link active" data-page="overview">Overview</button><button class="nav-link" data-page="reports">Manage Reports</button><button class="nav-link" data-page="users">Manage Users</button><button class="nav-link" data-page="claims">Manage Claims</button><button class="nav-link" data-page="verification">Verification Requests</button><button class="nav-link" data-page="notifications">Notifications</button><button class="nav-link" data-page="analytics">Reports & Analytics</button><button class="nav-link" data-page="settings">Settings</button>
      </nav>
      <div class="sidebar-bottom"><button class="theme-button" id="adminTheme" type="button">☀ <span>Toggle theme</span></button><button class="logout-button" id="adminLogout" type="button">Sign out</button></div>
    </aside>
    <main class="content admin-content">
      <header class="mobile-bar admin-mobile"><a href="index.html" aria-label="Back to NexusFind">←</a><strong>NexusFind · Admin</strong><button id="adminThemeMobile" type="button" aria-label="Toggle theme">☀</button><button id="adminLogoutMobile" type="button">Sign out</button></header>
      <section class="page admin-page"><header class="section-heading admin-heading"><div><h1 class="page-title" id="adminTitle">Overview</h1><p class="subtitle">Manage reports, claims, and campus activity.</p></div></header><p id="adminMessage" class="subtitle admin-message" role="status">Checking administrator access…</p><div id="adminView" aria-live="polite"></div></section>
    </main>
  </div>
  <div class="toast" id="adminToast" role="status"></div><script type="module" src="js/admin.js"></script>
</body>
</html>
